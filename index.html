<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Vibe Platform</title>
    <!-- Kütüphaneyi en başa alıyoruz -->
    <script src="https://cdn.jsdelivr.net/npm/buttplug@3.0.0/dist/web/buttplug.min.js"></script>
    <style>
        body { background: #121212; color: white; text-align: center; padding: 20px; }
        button { padding: 20px; background: #ff007f; border: none; color: white; border-radius: 10px; font-size: 18px; }
    </style>
</head>
<body>
    <h1>Vibe Platform</h1>
    <button id="connectBtn">Cihazı Bağla</button>

    <script>
        document.getElementById('connectBtn').addEventListener('click', async () => {
            // Tarayıcıdaki global Buttplug nesnesini kullan
            if (typeof Buttplug === 'undefined') {
                alert("Kütüphane yüklenemedi! Sayfayı tekrar yenile.");
                return;
            }

            try {
                const client = new Buttplug.ButtplugClient("Vibe Client");
                const connector = new Buttplug.ButtplugBrowserWebBluetoothConnector();
                await client.connect(connector);
                await client.startScanning();
                alert("Tarama başladı, lütfen cihazını eşleştir!");
                
                client.addListener("deviceadded", (device) => {
                    alert("Bağlandı: " + device.name);
                    device.vibrate(1.0);
                });
            } catch (e) {
                alert("Hata: " + e.message);
            }
        });
    </script>
</body>
</html>
